<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting...</title>
    <script>
      const params = new URLSearchParams(window.location.search);
      const cat = params.get('cat') || 'All';
      window.location.href = `products.html?cat=${encodeURIComponent(cat)}`;
    </script>
  </head>
  <body>
    <p>Redirecting to products page...</p>
  </body>
</html>
