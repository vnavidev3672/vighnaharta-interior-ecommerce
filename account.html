<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account – Vighnaharta House Of Interiors</title>
    <meta
      name="description"
      content="Login or Register to access Vighnaharta House Of Interiors products and services."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700&family=Quicksand:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="account.css" />
  </head>
  <body>
    <!-- Toast notification -->
    <div class="msg-toast" id="msgToast"></div>

    <!-- ===== NAVBAR ===== -->
    <header class="page-header">
      <div class="page-header__inner">
        <div class="logo">
          <a href="index.html"
            ><img src="images/logo1.jpg" alt="Vighnaharta Logo" width="110"
          /></a>
        </div>
        <nav class="page-nav">
          <ul id="MenuItems">
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="About.html">About</a></li>
            <li><a href="Contact.html">Contact</a></li>
            <li>
              <a href="account.html" class="active" id="accountLink">Account</a>
            </li>
          </ul>
          <img
            src="images/menu.png"
            class="menu-icon"
            alt="Open menu"
            onclick="menutoggle()"
          />
        </nav>
      </div>
    </header>

    <!-- ===== ACCOUNT HERO (background image + form) ===== -->
    <section class="account-hero">
      <!-- Form card -->
      <div class="form-container">
        <div class="form-btn">
          <span id="loginTab" onclick="login()">Login</span>
          <span id="registerTab" onclick="register()">Register</span>
          <hr id="Indicator" />
        </div>

        <!-- Login Form -->
        <form id="LoginForm">
          <input
            type="text"
            id="loginUsername"
            placeholder="Username or Email"
            required
          />
          <input
            type="password"
            id="loginPassword"
            placeholder="Password"
            required
          />
          <button type="submit" class="form-submit-btn">Login</button>
          <a href="#" class="form-forgot">Forgot Password</a>
        </form>

        <!-- Register Form -->
        <form id="RegForm">
          <input type="text" id="regUsername" placeholder="Username" required />
          <input type="email" id="regEmail" placeholder="Email" required />
          <input
            type="password"
            id="regPassword"
            placeholder="Password"
            required
          />
          <button type="submit" class="form-submit-btn">Register</button>
        </form>
      </div>
    </section>

    <!-- ===== FOOTER ===== -->
    <div class="footer">
      <div class="container">
        <div class="row">
          <div class="footer-col-2">
            <img src="images/logo1.jpg" alt="Vighnaharta Logo" />
            <p>
              "Crafting Timeless Wooden Interiors to Enrich Every Home."
              "Sustainably Designed Woodwork for Beautiful Living Spaces."
            </p>
          </div>
          <div class="footer-col-3">
            <h3>Follow Us</h3>
            <ul>
              <li>
                <a href="https://www.facebook.com/share/199rTxgHs7/"
                  >Facebook</a
                >
              </li>
              <li>
                <a
                  href="https://www.instagram.com/vighnahartajaysingpur?igsh=MWF1NmpzaWhicDNtNg=="
                  >Instagram</a
                >
              </li>
              <li>
                <a
                  href="https://youtube.com/@omkarsutar9231?si=MWVcyYJgZU0RmVL7"
                  >Youtube</a
                >
              </li>
            </ul>
          </div>
        </div>
        <hr />
        <p class="copyright">Copyright 2026</p>
      </div>
    </div>

    <script>
      /* ---- Mobile menu toggle ---- */
      var MenuItems = document.getElementById("MenuItems");
      MenuItems.style.maxHeight = "0px";
      function menutoggle() {
        if (MenuItems.style.maxHeight === "0px" || !MenuItems.style.maxHeight) {
          MenuItems.style.maxHeight = "450px";
        } else {
          MenuItems.style.maxHeight = "0px";
        }
      }
    </script>

    <script>
      var LoginForm = document.getElementById("LoginForm");
      var RegForm = document.getElementById("RegForm");
      var Indicator = document.getElementById("Indicator");

      function register() {
        RegForm.style.transform = "translateX(0)";
        LoginForm.style.transform = "translateX(-100%)";
        Indicator.style.transform = "translateX(50px)";
      }

      function login() {
        LoginForm.style.transform = "translateX(0)";
        RegForm.style.transform = "translateX(100%)";
        Indicator.style.transform = "translateX(-50px)";
      }

      // Toast notification helper
      function showToast(msg, type) {
        var toast = document.getElementById("msgToast");
        toast.textContent = msg;
        toast.className = "msg-toast " + (type || "success") + " show";
        setTimeout(function () {
          toast.classList.remove("show");
        }, 3500);
      }

      // Handle Registration
      RegForm.addEventListener("submit", async function (e) {
        e.preventDefault();
        var username = document.getElementById("regUsername").value.trim();
        var email = document.getElementById("regEmail").value.trim();
        var password = document.getElementById("regPassword").value;
        var btn = RegForm.querySelector(".form-submit-btn");
        btn.textContent = "Registering...";
        btn.disabled = true;

        try {
          var res = await fetch("/api/auth/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, email, password }),
          });
          var data = await res.json();
          if (data.success) {
            showToast("Registered! Now login with your credentials.");
            document.getElementById("loginUsername").value = username;
            RegForm.reset();
            login();
          } else {
            showToast(data.message || "Registration failed", "error");
          }
        } catch (err) {
          showToast("Network error. Please try again.", "error");
        } finally {
          btn.textContent = "Register";
          btn.disabled = false;
        }
      });

      // Handle Login
      LoginForm.addEventListener("submit", async function (e) {
        e.preventDefault();
        var username = document.getElementById("loginUsername").value.trim();
        var password = document.getElementById("loginPassword").value;
        var btn = LoginForm.querySelector(".form-submit-btn");
        btn.textContent = "Logging in...";
        btn.disabled = true;

        try {
          var res = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password }),
          });
          var data = await res.json();
          if (data.success) {
            localStorage.setItem("token", data.token);
            localStorage.setItem("userRole", String(data.user.role));
            localStorage.setItem("username", data.user.username);
            showToast("Login successful! Redirecting...");
            setTimeout(function () {
              window.location.href = "index.html";
            }, 1000);
          } else {
            showToast(data.message || "Login failed", "error");
            btn.textContent = "Login";
            btn.disabled = false;
          }
        } catch (err) {
          showToast("Network error. Please try again.", "error");
          btn.textContent = "Login";
          btn.disabled = false;
        }
      });
    </script>
    <script src="translate.js"></script>
  </body>
</html>
